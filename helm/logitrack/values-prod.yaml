# Production (locki-tracker-prod, sfo2). Synced by Argo CD - see argocd/.
# Image tags live in images-prod.yaml, bumped by promotion PRs.
#
# Sized for 3 x s-1vcpu-2gb nodes. Raise replicas/resources and turn autoscaling
# on (it also needs metrics-server) once the node pool is resized.

env: production

ingress:
  host: kmdndd.name.ng
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/limit-rps: "50"

certificates:
  enabled: true
  secretName: logitrack-tls
  issuer:
    type: acme
    name: logitrack-issuer
    acme:
      # Staging until the first certificate issues, then switch to
      # https://acme-v02.api.letsencrypt.org/directory (5 dupes/week limit).
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      email: itojedollars3@gmail.com

global:
  imagePullSecrets:
    - name: ghcr-pull

defaults:
  replicas: 1
  logLevel: info
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# UI and API are separate origins; CORS_ORIGINS must match the UI origin exactly.
services:
  api-gateway:
    host: api.kmdndd.name.ng   # path stays /api so /metrics is not public
    replicas: 2
    env:
      CORS_ORIGINS: https://kmdndd.name.ng
  frontend:
    host: kmdndd.name.ng
    env:
      API_URL: https://api.kmdndd.name.ng/api

# Seq runs without auth or TLS.
logging:
  enabled: false
