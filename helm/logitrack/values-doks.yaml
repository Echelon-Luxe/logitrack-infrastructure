# DOKS dev cluster (lon1). Applied by .github/workflows/deploy.yml over values.yaml.

ingress:
  className: nginx   # must match the controller in platform.tf
  host: dev.kmdndd.name.ng

certificates:
  enabled: true
  secretName: logitrack-tls
  issuer:
    type: acme
    name: logitrack-issuer
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: itojedollars3@gmail.com

global:
  imagePullSecrets:
    - name: ghcr-pull   # created by registry.tf

# Seq runs without auth or TLS, so it stays off on a public cluster.
logging:
  enabled: false

# Fallback tags for a first install; deploy.yml keeps whatever is already running.
# UI and API are separate origins; CORS_ORIGINS must match the UI origin exactly.
services:
  frontend:
    env:
      API_URL: https://api.dev.kmdndd.name.ng/api
    image:
      tag: e6c932d50b1062a28145f710ef7e8871f362c3a7
  api-gateway:
    host: api.dev.kmdndd.name.ng
    env:
      CORS_ORIGINS: https://dev.kmdndd.name.ng
    image:
      tag: df3a29e7508f2bb20925134c04b207b08c21a659
  user-service:
    image:
      tag: 489ff9d023410afae8e4156b4a104179f1facf22
  shipment-service:
    image:
      tag: 861d51c78d15861f12252de7ad73a6e3c66ae1f7
  driver-service:
    image:
      tag: eabb8488396d7ca119b982b0f32851809669348e
  tracking-service:
    image:
      tag: ed853cda503e41d085042092dd7696b85759b55f
  notification-service:
    image:
      tag: 5c0dfd8bdd971137b24848adaff7073ba5b43348
  payment-service:
    image:
      tag: 55b7c94754614e7dd0f91dba56b23c19a40f0864
