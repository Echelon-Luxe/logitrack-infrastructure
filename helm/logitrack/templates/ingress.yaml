{{- if .Values.ingress.enabled }}
{{- /*
  Group every `public: true` service by the host it answers on. A service may
  declare its own `host:` (e.g. api-gateway on api.<domain>); anything without
  one falls back to the shared `ingress.host`, which keeps single-host
  path-routing working for dev/kind untouched.

  $hosts: { "<host>": [ {path,name,port}, ... ] }
*/}}
{{- $hosts := dict }}
{{- range $name, $svc := .Values.services }}
  {{- if $svc.public }}
    {{- $host := $svc.host | default $.Values.ingress.host }}
    {{- $entry := dict "path" (default "/" $svc.path) "name" $name "port" $svc.port }}
    {{- $existing := index $hosts $host | default (list) }}
    {{- $_ := set $hosts $host (append $existing $entry) }}
  {{- end }}
{{- end }}
{{- if not $hosts }}
  {{- fail "ingress.enabled is true but no service is marked `public: true`" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logitrack
  labels:
    {{- include "logitrack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.certificates.enabled }}
  # One SAN cert (certificates.secretName) covering every public host.
  tls:
    - hosts:
        {{- range $host, $entries := $hosts }}
        - {{ $host | quote }}
        {{- end }}
      secretName: {{ .Values.certificates.secretName }}
  {{- end }}
  rules:
    {{- range $host, $entries := $hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          # One path per public service on this host. Backends without
          # `public: true` stay cluster-internal, behind the gateway.
          #
          # ingress-nginx matches the longest prefix, not the first listed, so
          # co-located paths like "/" and "/api" on the same host resolve
          # correctly regardless of render order.
          {{- range $entries }}
          - path: {{ .path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
{{- end }}
