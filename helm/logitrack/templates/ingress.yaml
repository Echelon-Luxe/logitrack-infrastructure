{{- if .Values.ingress.enabled }}
{{- $public := dict }}
{{- range $name, $svc := .Values.services }}
  {{- if $svc.public }}
    {{- $_ := set $public (default "/" $svc.path) (dict "name" $name "port" $svc.port) }}
  {{- end }}
{{- end }}
{{- if not $public }}
  {{- fail "ingress.enabled is true but no service is marked `public: true`" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logitrack
  labels:
    {{- include "logitrack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.certificates.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.certificates.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # One rule per service marked `public: true`, at its own `path`.
          # Backends without one stay cluster-internal.
          #
          # Rendered in key order, so "/" comes before "/api". That is fine:
          # ingress-nginx matches the longest prefix, not the first listed, so
          # /api/shipments reaches the gateway rather than the frontend.
          {{- range $path, $backend := $public }}
          - path: {{ $path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backend.name }}
                port:
                  number: {{ $backend.port }}
          {{- end }}
{{- end }}
