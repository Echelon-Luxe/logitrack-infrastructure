{{- range $name, $svc := .Values.services }}
{{- $cfg := include "logitrack.config" (dict "svc" $svc "root" $) | fromYaml }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "logitrack.labels" $ | nindent 4 }}
    {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    # Percentage of the REQUEST, not the limit. Needs metrics-server installed
    # or the HPA reports <unknown> forever and silently never scales.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
{{- end }}
{{- end }}