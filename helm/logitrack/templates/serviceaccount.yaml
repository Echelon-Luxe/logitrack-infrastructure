{{- if .Values.serviceAccount.create }}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "logitrack.labels" $ | nindent 4 }}
    {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 4 }}
# No RoleBinding attached - no service talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}