{{- range $name, $svc := .Values.services }}
{{- $cfg := include "logitrack.config" (dict "svc" $svc "root" $) | fromYaml }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "logitrack.labels" $ | nindent 4 }}
    {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 4 }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  # Omitted when the HPA is on, otherwise every helm upgrade resets the count.
  replicas: {{ $cfg.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $cfg.strategy.maxSurge }}
      maxUnavailable: {{ $cfg.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logitrack.labels" $ | nindent 8 }}
        {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 8 }}
      annotations:
        # Without this, editing a ConfigMap does not restart pods and they keep
        # serving stale config until something unrelated restarts them.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $cfg.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ $name }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}

      # ScheduleAnyway, not DoNotSchedule - a hard constraint leaves pods
      # Pending on a single-node kind cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "logitrack.selectorLabels" (dict "name" $name) | nindent 14 }}

      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/logitrack-{{ $name }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
            {{- if $.Values.secrets.enabled }}
            # Neither is templated - putting these in a chart means putting them
            # in git - so both Secrets are created out of band and only
            # referenced here.
            #
            # Shared: signing keys, third-party API keys. Everything that is the
            # same for every service.
            - secretRef:
                name: {{ $.Values.secrets.name }}
                optional: true
            # Per service: DATABASE_URL and DIRECT_URL. Each service owns its own
            # schema, so a single shared connection string points all seven at
            # one schema - which looks healthy, because /readyz only runs
            # SELECT 1, and then fails on the first real query.
            #
            # Listed second on purpose: envFrom applies in order, so a key here
            # overrides the same key in the shared Secret.
            - secretRef:
                name: {{ $name }}-secrets
                optional: true
            {{- end }}
          {{- with $cfg.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}

          startupProbe:
            httpGet:
              path: {{ $cfg.probes.startup.path }}
              port: http
            periodSeconds: {{ $cfg.probes.startup.periodSeconds }}
            failureThreshold: {{ $cfg.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $cfg.probes.readiness.path }}
              port: http
            periodSeconds: {{ $cfg.probes.readiness.periodSeconds }}
            failureThreshold: {{ $cfg.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $cfg.probes.liveness.path }}
              port: http
            periodSeconds: {{ $cfg.probes.liveness.periodSeconds }}
            failureThreshold: {{ $cfg.probes.liveness.failureThreshold }}

          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          # readOnlyRootFilesystem requires an explicit writable /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
