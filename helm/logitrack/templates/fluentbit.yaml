{{- if .Values.logging.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  # Read-only, and only what the kubernetes filter needs to attach pod metadata.
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
      annotations:
        # Container logs live on the node, so a config change needs a restart
        # to be picked up.
        checksum/config: {{ include (print $.Template.BasePath "/fluentbit-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: fluent-bit
      # A DaemonSet that skips the control-plane node misses anything scheduled
      # there, which on a one-node kind cluster is everything.
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: {{ .Values.logging.fluentbit.image }}
          ports:
            - name: metrics
              containerPort: 2020
          resources:
            {{- toYaml .Values.logging.fluentbit.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            # Node log directories. varlibdockercontainers holds the real files;
            # /var/log/containers is symlinks into it, so both are required.
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}
