global:
  registry: ghcr.io/echelon-luxe
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# Applied to every service, overridden per service in `services:`.
defaults:
  replicas: 1

  # Set by the GitOps promotion PR. Never "latest" - it is mutable and unrollbackable.
  image:
    tag: dev

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  # liveness must never check dependencies - failing it kills the container,
  # so a DB blip would restart every pod at once. Dependency checks go in readiness.
  probes:
    startup:
      path: /healthz
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      path: /readyz
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      path: /healthz
      periodSeconds: 20
      failureThreshold: 3

  terminationGracePeriodSeconds: 30

  strategy:
    maxSurge: 1
    maxUnavailable: 0

  env: {}

services:
  # `public: true` gives a service an ingress rule at `path`. Everything else is
  # cluster-internal - exposing a backend directly would bypass the gateway's
  # JWT verification and rate limiting.
  api-gateway:
    port: 8080
    public: true
    path: /api
    replicas: 2
  frontend:
    port: 3000
    public: true
    path: /
  user-service:
    port: 3001
  shipment-service:
    port: 3002
  driver-service:
    port: 3003
  tracking-service:
    port: 3004
  notification-service:
    port: 3005
  payment-service:
    port: 3006

# Secret mounted into every service as environment variables. Created out of
# band (see local/README.md); the chart only references it.
secrets:
  enabled: true
  name: logitrack-secrets

# Everything routes to the gateway. Exposing backends directly would bypass
# its JWT verification and rate limiting.
ingress:
  enabled: true
  className: nginx
  host: logitrack.local
  annotations: {}

certificates:
  enabled: true
  secretName: logitrack-tls
  issuer:
    type: selfSigned    # selfSigned for kind, acme for real DNS
    name: logitrack-issuer
    acme:
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      email: ""

serviceAccount:
  create: true

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Seq log server plus the Fluent Bit agent that feeds it. Services already log
# structured JSON to stdout, so nothing in the application changes.
logging:
  enabled: true

  seq:
    image: datalust/seq:2024.3
    acceptEula: true
    ingestionPort: 5341
    uiPort: 80
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    retentionDays: 7

  fluentbit:
    image: fluent/fluent-bit:3.1.9
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Only this namespace; kube-system noise drowns the signal.
    namespaces:
      - logitrack-dev

  ingress:
    enabled: true
    className: nginx
    host: logs.logitrack.local
