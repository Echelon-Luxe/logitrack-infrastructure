name: deploy

# Fired by a service repository once it has built, scanned and pushed an image.
# The service repo never touches the cluster - it only reports "this SHA exists",
# and this repository decides what runs, which is why image tags live here.
#
# Manual runs are for redeploying the current tags, or deploying a specific SHA
# without a push on the service side.
on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy (e.g. shipment-service). Leave blank to redeploy current tags.
        required: false
      image_tag:
        description: Full git SHA of the image. Required when service is set.
        required: false

concurrency:
  # One deploy at a time. Two in parallel would race on the values commit and on
  # the Helm release lock.
  group: deploy-dev
  cancel-in-progress: false

env:
  NAMESPACE: logitrack-dev
  RELEASE: logitrack
  CHART: ./helm/logitrack
  VALUES: ./helm/logitrack/values-doks.yaml

jobs:
  deploy:
    name: deploy to dev-cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev

      - name: Resolve inputs
        id: input
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag }}
        run: |
          set -euo pipefail

          # Both values arrive from a dispatch payload and end up in a shell
          # script and a committed file, so they are constrained before they are
          # written anywhere.
          if [ -n "${SERVICE}" ] && ! echo "${SERVICE}" | grep -qE '^[a-z0-9-]+$'; then
            echo "::error::service must match ^[a-z0-9-]+$, got '${SERVICE}'"
            exit 1
          fi

          if [ -n "${SERVICE}" ] && [ -z "${IMAGE_TAG}" ]; then
            echo "::error::service was given without image_tag"
            exit 1
          fi

          # Anything but a 40-character hex SHA is rejected: this value is written
          # into a committed file and then pulled as a container image, so it is
          # not somewhere to trust an arbitrary dispatch payload.
          if [ -n "${IMAGE_TAG}" ] && ! echo "${IMAGE_TAG}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::image_tag must be a full 40-character git SHA, got '${IMAGE_TAG}'"
            exit 1
          fi

          # Only services the chart actually knows about.
          if [ -n "${SERVICE}" ] && ! yq -e ".services | has(\"${SERVICE}\")" "${{ env.CHART }}/values.yaml" >/dev/null 2>&1; then
            echo "::error::'${SERVICE}' is not in values.yaml services"
            exit 1
          fi

          # Written only once everything above has passed.
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4
        with:
          version: v3.16.3

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo '${{ secrets.KUBE_CONFIG }}' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # Scoped to logitrack-dev by RBAC, so this is the only thing it can see.
          kubectl -n "${NAMESPACE}" get deployments

      - name: Helm upgrade
        run: |
          set -euo pipefail
          SERVICE='${{ steps.input.outputs.service }}'
          TAG='${{ steps.input.outputs.image_tag }}'

          # Only when a service was named. A bare run redeploys whatever tags
          # values-doks.yaml already pins.
          EXTRA=()

          # Helm re-renders the WHOLE release every run, and the tags in
          # values-doks.yaml are a floor, not a record. Without this loop,
          # deploying one service would re-render every other service back to
          # its pinned tag - silently rolling back whatever was deployed last.
          #
          # So the running tags are read back off the cluster and re-asserted.
          # The cluster is the source of truth for what is live; this keeps it
          # that way. On a first install there are no Deployments yet, the loop
          # is a no-op, and the pinned tags apply.
          for name in $(kubectl -n "${NAMESPACE}" get deploy -o custom-columns=:.metadata.name --no-headers); do
            [ "${name}" = "${SERVICE}" ] && continue
            image=$(kubectl -n "${NAMESPACE}" get deploy "${name}" -o jsonpath='{.spec.template.spec.containers[0].image}')
            EXTRA+=(--set "services.${name}.image.tag=${image##*:}")
          done

          if [ -n "${SERVICE}" ]; then
            EXTRA+=(--set "services.${SERVICE}.image.tag=${TAG}")
            echo "Deploying ${SERVICE} at ${TAG}"
          else
            echo "No service given - redeploying tags already running."
          fi

          echo "Tag overrides: ${EXTRA[*]:-none}"

          helm upgrade --install "${RELEASE}" "${CHART}" \
            --namespace "${NAMESPACE}" \
            -f "${CHART}/values.yaml" \
            -f "${VALUES}" \
            "${EXTRA[@]}" \
            --timeout 5m


      # helm --wait blocks on EVERY pod in the release, so a single unhealthy
      # service - one nobody touched - fails every deploy and burns the full
      # timeout doing it. Waiting on just the rolled Deployment makes a deploy
      # take as long as that one service, and lets an unrelated broken pod stay
      # broken without blocking anyone else's release.
      - name: Wait for the rollout
        run: |
          set -euo pipefail
          SERVICE='${{ steps.input.outputs.service }}'

          if [ -n "${SERVICE}" ]; then
            kubectl -n "${NAMESPACE}" rollout status "deployment/${SERVICE}" --timeout=5m
          else
            # No service named: this was a manual redeploy, so check them all.
            for d in $(kubectl -n "${NAMESPACE}" get deploy -o name); do
              kubectl -n "${NAMESPACE}" rollout status "${d}" --timeout=5m
            done
          fi

      - name: Report
        if: always()
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide || true
          kubectl -n "${NAMESPACE}" get certificate,ingress || true

      # The rollout check already failed the job by here; this is for the reader.
      - name: Why it failed
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n "${NAMESPACE}" describe pods | grep -A5 -iE 'warning|error|backoff' | head -60 || true

      # Last, so the outcome of every step above is known. Never fails the run.
      - name: Notify Slack
        if: always() && job.status != 'cancelled'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SERVICE: ${{ steps.input.outputs.service }}
          IMAGE_TAG: ${{ steps.input.outputs.image_tag }}
        run: |
          set -uo pipefail
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo "No Slack webhook configured; skipping."; exit 0; }

          esc() { sed -e 's/\\/\\\\/g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${SERVICE}" ]; then
            what="\`${SERVICE}\` at \`${IMAGE_TAG:0:7}\`"
          else
            what="current tags (redeploy)"
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
            text=":white_check_mark: *Deployed* ${what} to \`${NAMESPACE}\`\nby ${GITHUB_ACTOR} - <${run_url}|view run>"
          else
            # Best effort: the kubeconfig may not exist if we failed early.
            events=$(kubectl -n "${NAMESPACE}" get events --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -5 | cut -c1-200 | esc || true)
            text=":x: *Deploy failed* for ${what} on \`${NAMESPACE}\`\nby ${GITHUB_ACTOR} - <${run_url}|view run>"
            [ -z "${events}" ] || text="${text}\n\`\`\`${events}\`\`\`"
          fi

          jq -n --arg text "$(printf '%b' "${text}")" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-type: application/json' --data @- "${SLACK_WEBHOOK_URL}" \
            || echo "::warning::Slack notification failed"
